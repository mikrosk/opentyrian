name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: macOS (universal .app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe --tags for the version string
      - name: Install build dependencies
        run: brew install pkgconf sdl12-compat
      - name: Compile check (debug, -Werror, Homebrew sdl12-compat)
        run: make -j"$(sysctl -n hw.ncpu)" debug
      - name: Smoke test
        run: ./opentyrian --help
      - name: Cache game data
        uses: actions/cache@v6
        with:
          path: data
          key: tyrian21-data-v1
      - name: Build OpenTyrian.app (universal, bundled sdl12-compat + SDL2 + game data)
        run: ./make_macos.sh
      - name: Verify the bundle
        run: |
          lipo -archs build/OpenTyrian.app/Contents/MacOS/opentyrian-bin | grep -q "x86_64 arm64"
          lipo -archs build/OpenTyrian.app/Contents/Frameworks/libSDL-1.2.0.dylib | grep -q "x86_64 arm64"
          test -f build/OpenTyrian.app/Contents/Resources/data/tyrian1.lvl
          test -d build/OpenTyrian.app/Contents/Frameworks/SDL2.framework
          # nothing may reference Homebrew - only the bundled libraries
          if otool -L build/OpenTyrian.app/Contents/MacOS/opentyrian-bin \
                      build/OpenTyrian.app/Contents/Frameworks/libSDL-1.2.0.dylib | grep -q /opt/homebrew; then exit 1; fi
      - name: Smoke test the bundle
        run: build/OpenTyrian.app/Contents/MacOS/opentyrian --help
      - name: Zip app (preserving symlinks)
        run: cd build && zip -r -y opentyrian-macos-universal.zip OpenTyrian.app
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/opentyrian-macos-universal.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          asset="opentyrian-$tag-macos-universal.zip"
          mv build/opentyrian-macos-universal.zip "$asset"
          gh release upload "$tag" "$asset" --clobber
